# ============================================================
# Tmux Configuration
# ============================================================

# ── General Settings ────────────────────────────────────────
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g focus-events on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# ── Prefix ──────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Reload Config ───────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Vi Mode ─────────────────────────────────────────────────
set-window-option -g mode-keys vi

# Vi copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Paste from clipboard
bind p run "wl-paste | tmux load-buffer - && tmux paste-buffer"

# ── Pane Navigation (Vim-like) ──────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window Navigation ───────────────────────────────────────
bind -r p previous-window
bind -r n next-window
bind -r J switch-client -p
bind -r K switch-client -n

# ── Splitting ───────────────────────────────────────────────
# Split in current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Rename window
bind R command-prompt -I "#W" "rename-window '%%'"

# ── Catppuccin Mocha Theme ──────────────────────────────────
# Colors
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Status line
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-fg "${thm_fg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
setw -g window-status-style "fg=${thm_fg},bg=${thm_bg}"
setw -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},underscore"

# Status format
set -g status-left "#[fg=${thm_bg},bg=${thm_blue},bold] #S #[fg=${thm_blue},bg=${thm_bg},nobold]"
set -g status-right "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_blue},bg=${thm_gray}] %Y-%m-%d  %H:%M #[fg=${thm_blue},bg=${thm_gray}]#[fg=${thm_bg},bg=${thm_blue},bold] #h "

setw -g window-status-format "#[fg=${thm_bg},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_bg}] #I  #W #[fg=${thm_bg},bg=${thm_bg}]"
setw -g window-status-current-format "#[fg=${thm_bg},bg=${thm_gray}]#[fg=${thm_blue},bg=${thm_gray},bold] #I  #W #[fg=${thm_gray},bg=${thm_bg}]"

# ── Environment Variables ───────────────────────────────────
set-option -g update-environment "\
  SWAYSOCK \
  WAYLAND_DISPLAY \
  XDG_RUNTIME_DIR \
  DISPLAY \
  SSH_AUTH_SOCK \
  SSH_CONNECTION"
